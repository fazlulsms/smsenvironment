<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Eidikos Cert brand mark: blue wireframe globe + green "TRUST" hand -->
  <g fill="none" stroke="#1763b3" stroke-width="8" stroke-linecap="round">
    <circle cx="140" cy="150" r="112"/>
    <ellipse cx="140" cy="150" rx="42" ry="112" stroke-width="6"/>
    <ellipse cx="140" cy="150" rx="82" ry="112" stroke-width="6"/>
    <ellipse cx="140" cy="150" rx="112" ry="44" stroke-width="6"/>
    <ellipse cx="140" cy="150" rx="112" ry="82" stroke-width="6"/>
  </g>
  <!-- Hand (green), drawn over the right of the globe -->
  <g fill="#2f9b41">
    <!-- forearm -->
    <rect x="196" y="150" width="46" height="120" rx="16"/>
    <!-- palm -->
    <rect x="182" y="120" width="76" height="62" rx="20"/>
    <!-- fingers -->
    <rect x="188" y="72" width="15" height="92" rx="7"/>
    <rect x="207" y="56" width="15" height="108" rx="7"/>
    <rect x="226" y="70" width="15" height="94" rx="7"/>
    <rect x="245" y="92" width="14" height="74" rx="7"/>
    <!-- thumb -->
    <rect x="166" y="150" width="14" height="52" rx="7" transform="rotate(-34 173 176)"/>
  </g>
  <!-- vertical TRUST on the forearm -->
  <text x="219" y="228" transform="rotate(-90 219 220)" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24"
        letter-spacing="2" fill="#ffffff">TRUST</text>
</svg>
